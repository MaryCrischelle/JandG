<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wedding Table Finder - Find your assigned table for the wedding celebration">
    <meta name="theme-color" content="#938ba1">
    <title>Wedding Table Finder</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to Our Wedding</h1>
        </header>
        
        <main>
            <section class="welcome-section">
                <p>We're delighted you could join us on our special day.</p>
                <p>Please enter your name to find your table assignment.</p>
            </section>
            
            <section class="form-section">
                <form id="tableFinder" aria-label="Table finder form">
                    <div class="form-group">
                        <label for="guestName" class="visually-hidden">Enter your full name</label>
                        <input type="text" id="guestName" placeholder="Enter your full name" required aria-label="Guest name input">
                    </div>
                    <button type="submit" class="btn" aria-label="Find my table">Find My Table</button>
                </form>
            </section>
            
            <section class="result-section" id="resultSection">
                <!-- Results will appear here -->
            </section>
        </main>
        
        <footer>
            <p>Thank you for celebrating with us!</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
